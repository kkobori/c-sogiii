name: build-android-hsp
on:
  workflow_dispatch:
  push:
    paths: ['hsp/**', 'android/**', 'tools/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install NDK / platform
        run: sdkmanager "ndk;26.3.11579264" "platforms;android-35" "build-tools;35.0.0"
      - name: Build official HSP tools (hspcmp / hsp3cnv)
        run: ./tools/build_hsp_tools.sh ./hsptools
      - name: HSP script -> C++ (same as HSP3Dish Helper)
        working-directory: hsp
        run: |
          ../hsptools/hspcmp -i -u --compath=../hsptools/common/ main.hsp
          ../hsptools/hsp3cnv -d main
          cp main.cpp ../android/app/jni/hsp3embed/hspsource.cpp
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "RELEASE_PASSWORD=$RELEASE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 未設定: テスト用の使い捨て鍵で署名します(配布不可)"
            keytool -genkeypair -keystore android/app/release.keystore -alias hspapp -keyalg RSA -keysize 2048 -validity 10000 -storepass testpass123 -keypass testpass123 -dname "CN=test"
            echo "RELEASE_PASSWORD=testpass123" >> "$GITHUB_ENV"
          fi
      - name: Gradle (apk + aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hsp-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
